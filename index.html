<!doctype html>
<!-- \author Toximik -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RC_Controller Configurator</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>RC_Controller <span>configurator</span></h1>
      <div class="conn">
        <span id="conn-state" class="pill">disconnected</span>
        <label class="showall"><input type="checkbox" id="show-all" /> all ports</label>
        <button id="reboot" class="secondary" hidden title="Restart the board (refused while armed or saving)">Reboot</button>
        <button id="connect">Connect</button>
      </div>
    </header>
    <main>
      <div id="notice" class="notice" hidden></div>
      <section id="identity" class="card" hidden></section>
      <nav id="tabs" class="tabs" hidden>
        <a href="#status">Status</a>
        <a href="#outputs">Outputs</a>
      </nav>
      <section id="status" hidden></section>
      <section id="outputs" hidden></section>
    </main>
    <footer id="footer"></footer>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
